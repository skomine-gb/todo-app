# CI（継続的インテグレーション）
# PR の作成・更新のたびに「整形・Lint・型チェック・テスト・ビルド」を自動実行し、
# ローカルの STEP 完了基準（vp check / vp test / vp run test:worker）と同じ検証を GitHub 上でも保証する。
# 詳細は docs/10-ci-cd.md を参照。

name: CI

on:
  # PR の作成時・更新時（push のたび）に実行される
  pull_request:
  # main へ push（= PR のマージ）されたときにも実行される
  push:
    branches: [main]

# 同じ PR に連続で push したとき、走行中の古い実行をキャンセルする節約設定。
# main への push はキャンセルしない（デプロイの前提になるため必ず完走させる）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ジョブに渡される GITHUB_TOKEN の権限。この CI はコードを読んで検証するだけなので
# 読み取り専用に絞る（pnpm install が実行する依存パッケージのスクリプトにも
# 書き込み権限を見せないための安全策）。
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # 通常 2〜3 分で終わるパイプライン。指定しないと上限が 360 分になり、
    # テストがハングしたときにランナー（無料枠の実行時間）を浪費してしまう
    timeout-minutes: 10
    steps:
      # リポジトリのコードを CI マシンに取得する
      - uses: actions/checkout@v5

      # Vite+ 公式のセットアップアクション。vp CLI・Node.js・pnpm の用意と依存キャッシュを
      # これ 1 つで面倒を見る（pnpm のバージョンは package.json の devEngines.packageManager
      # から解決されるため、ここに書く必要がない = 二重管理にならない）。
      # 注意: 上流の moving tag `v1` は v1.15.0 で凍結済みのため、正確なバージョンを指定する
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "24"
          cache: true

      # lockfile（pnpm-lock.yaml）どおりに依存を入れる。
      # --frozen-lockfile により、ローカルと同じバージョンの wrangler / workerd が CI でも使われる
      - run: vp install --frozen-lockfile

      # install 時の postinstall（wrangler types）が worker-configuration.d.ts を再生成する。
      # コミット済みの内容と差分が出る＝「bindings 変更後に vp run types の結果をコミットし忘れた」を検出できる
      - name: 生成ファイル（worker-configuration.d.ts）に差分がないか確認
        run: git diff --exit-code worker-configuration.d.ts

      # ここから下はローカルの検証コマンドと完全に同じ（setup-vp が vp を PATH に入れるため）

      # 整形・Lint・型チェック
      - run: vp check

      # フロントエンドのテスト（jsdom）
      - run: vp test

      # バックエンドのテスト（Workers ランタイム = workerd 上で実行）
      - run: vp run test:worker

      # 本番と同じ手順でビルドできることを確認（dist/client + Worker 本体）
      - run: vp build
