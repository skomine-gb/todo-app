# CD（継続的デリバリー）
# main への push（= PR のマージ）で CI（ci.yml）が成功したあと、Cloudflare Workers へ自動デプロイする。
# workflow_run トリガーで CI の完了を受けて起動し、成功したときだけ job が動く。
# 詳細は docs/10-ci-cd.md §4 を参照。

name: Deploy

on:
  # main で走った CI ワークフローの完了を受けて起動する。
  # workflows の "CI" は ci.yml の name への文字列参照。ci.yml の name を変えたらここも揃えること。
  # 注意: types: completed は CI が「失敗して完了」しても発火する（完了であって成功ではない）。
  # 成功したときだけデプロイする判定は job の if（workflow_run.conclusion）で行う
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Actions タブから手動でも実行できる（デプロイだけやり直したいとき用。docs/10 §5 参照）
  workflow_dispatch:

# デプロイは並行させない。走行中の run は自動キャンセルしない（本番が中途半端になるのを防ぐ）。
# 同じグループに待機できる run は 1 件までのため、短時間に連続マージしても
# 最新コミットのデプロイは必ず実行される。
# group に ref を含めるのは、別ブランチからの手動実行（job は skip される）が main と同じ
# グループに入り、待機中の main のデプロイを置き換えて消してしまうのを防ぐため
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# デプロイの認証は GITHUB_TOKEN ではなく Cloudflare の Secrets で行うため、読み取り専用に絞る
permissions:
  contents: read

# アクションはコミット SHA で固定（理由は ci.yml と docs/10 §5 を参照。更新は `pinact run -u`）
jobs:
  deploy:
    # 動かす条件：
    # - CI の完了で起動した場合、「成功」かつ「push（= main へのマージ）で走った CI」だけ。
    #   conclusion のチェックは必須（失敗した完了でも workflow_run は発火する）。
    #   event のチェックも必須：ci.yml は PR でも走るため、fork の main ブランチから PR を出されると
    #   その CI 完了でも branches: [main] フィルタ（head ブランチ名で判定される）を通ってしまう。
    #   push に絞ることで、部外者の PR が本番デプロイを発火させる経路を塞ぐ
    # - 手動実行の場合：main ブランチからだけ（workflow_run では github.ref は常にデフォルトブランチの
    #   ため、この条件は手動実行にだけ効く）。これは事故防止のガードであって強制ではない。
    #   厳密に強制したくなったら GitHub Environments の deployment branches 制限を使う（docs/10 §4）
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' ||
       github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # ビルドに加えて Cloudflare API 依存のマイグレーション適用・デプロイが乗る。
    # マイグレーション適用後にタイムアウトすると本番が「新スキーマ × 旧コード」で残るため、
    # ハング対策としてだけ効く余裕のある値にする
    timeout-minutes: 15
    steps:
      # CI が検証したコミット（workflow_run.head_sha）をそのままデプロイする。
      # ref を指定しないと「デプロイ時点の main の最新」が取られ、連続マージのとき
      # CI がまだ終わっていないコミットを出荷しうる。手動実行には head_sha がないため
      # main の最新（github.ref）にフォールバックする
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - run: vp install --frozen-lockfile

      # デプロイする成果物を作る（dist/client = SPA、dist/todo_app = Worker 本体）。
      # 検証（check / test / test:worker）は起動条件の CI が済ませているため、ここでは行わない
      - run: vp build

      # 本番 D1 に未適用のマイグレーションだけを適用する（デプロイより先。順序の理由と
      # 「マイグレーションは後方互換に書く」ルールは docs/10 §4 を参照）。
      # - DB はデータベース名ではなく binding 名（wrangler.jsonc の "DB"）で指定し、名前の二重管理を避ける
      # - vp exec で実行するのは、vp install で入った lockfile どおりの wrangler を確実に使うため。
      #   wrangler-action は使わない：ランナーに pnpm コマンドがなく、npm 経由も package.json の
      #   devEngines（pnpm 宣言）に実行を拒否されるため、このプロジェクトでは動かない（docs/10 §4）
      # - wrangler は認証情報を環境変数 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID から読む
      - run: vp exec wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Worker と SPA（dist/client を Static Assets として）を本番へデプロイ
      - run: vp exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
