# CD（継続的デリバリー）
# main への push（= PR のマージ）で Cloudflare Workers へ自動デプロイする。
# CI（ci.yml）とはファイルを分け、このワークフロー自身が検証を最初から実行する：
# 検証ステップのどれかが落ちればデプロイのステップには到達しない（= CI が通ったものだけ届く）。
# 詳細は docs/10-ci-cd.md §4 を参照。

name: Deploy

on:
  # main への push（= PR のマージ）で自動デプロイ
  push:
    branches: [main]
  # Actions タブから手動でも実行できる（デプロイだけやり直したいとき用。docs/10 §5 参照）
  workflow_dispatch:

# デプロイは並行させない。走行中の run は自動キャンセルしない（本番が中途半端になるのを防ぐ）。
# 同じグループに待機できる run は 1 件までのため、短時間に連続マージしても
# 最新コミットのデプロイは必ず実行される。
# group に ref を含めるのは、別ブランチからの手動実行（job は skip される）が main と同じ
# グループに入り、待機中の main のデプロイを置き換えて消してしまうのを防ぐため
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# デプロイの認証は GITHUB_TOKEN ではなく Cloudflare の Secrets で行うため、読み取り専用に絞る
permissions:
  contents: read

# アクションはコミット SHA で固定（理由は ci.yml と docs/10 §5 を参照。更新は `pinact run -u`）
jobs:
  deploy:
    # workflow_dispatch は任意のブランチから実行できてしまうため、main 以外なら skip する。
    # これは事故防止のガードであって強制ではない（選んだブランチ側のファイルが実行されるため、
    # ブランチ上で書き換えれば通ってしまう）。厳密に強制したくなったら GitHub Environments の
    # deployment branches 制限を使う（docs/10 §4）
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 検証（2〜3 分）に加えて Cloudflare API 依存のマイグレーション適用・デプロイが乗るため、
    # ci job より余裕を持たせる。マイグレーション適用後にタイムアウトすると本番が
    # 「新スキーマ × 旧コード」で残るため、ハング対策としてだけ効く値にする
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - run: vp install --frozen-lockfile

      # ここから ci.yml と同じ検証。マージコミットに対して検証し直し、
      # 通らなければ以降のデプロイには進まない
      - run: vp check

      - run: vp test

      - run: vp run test:worker

      # デプロイする成果物を作る（dist/client = SPA、dist/todo_app = Worker 本体）
      - run: vp build

      # 本番 D1 に未適用のマイグレーションだけを適用する（デプロイより先。順序の理由と
      # 「マイグレーションは後方互換に書く」ルールは docs/10 §4 を参照）。
      # - DB はデータベース名ではなく binding 名（wrangler.jsonc の "DB"）で指定し、名前の二重管理を避ける
      # - packageManager: npm は必須。ランナーの PATH に pnpm コマンドがないため（理由の詳細は docs/10 §4）
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: d1 migrations apply DB --remote

      # Worker と SPA（dist/client を Static Assets として）を本番へデプロイ
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: deploy
